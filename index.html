<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>조조전풍 SRPG</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #1a1c22;
      color: #e8e6e0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 { font-size: 18px; margin: 4px 0 12px; color: #d9c07a; }
    #wrap { position: relative; }
    #wrap canvas {
      display: block;
      border: 2px solid #3a3f4d;
      border-radius: 6px;
      max-width: 100%;
      height: auto;
      cursor: pointer;
    }
    #banner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      color: #ffe14d;
      text-shadow: 0 2px 8px #000;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      white-space: pre-line;
      text-align: center;
      z-index: 20;
    }
    #banner.show { opacity: 1; }
    #menu {
      position: absolute;
      display: none;
      flex-direction: column;
      gap: 2px;
      background: #262a35;
      border: 1px solid #d9c07a;
      border-radius: 6px;
      padding: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      z-index: 10;
      min-width: 120px;
    }
    #menu button {
      background: transparent;
      color: #e8e6e0;
      border: none;
      border-radius: 4px;
      padding: 7px 12px;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    #menu button span { color: #9aa3b5; font-size: 12px; }
    #menu button:hover:not(:disabled) { background: #3a4256; }
    #menu button:disabled { color: #5a6070; cursor: default; }
    .float {
      position: absolute;
      transform: translate(-50%, -100%);
      font-weight: bold;
      font-size: 20px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 15;
      animation: floatUp 1.25s ease-out forwards;
      white-space: nowrap;
    }
    @keyframes floatUp {
      from { opacity: 1; margin-top: 0; }
      70% { opacity: 1; }
      to { opacity: 0; margin-top: -44px; }
    }
    #hud {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 10px;
      width: 100%;
      max-width: 800px;
    }
    #info {
      flex: 1;
      background: #262a35;
      border: 1px solid #3a3f4d;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 14px;
      line-height: 1.5;
      min-height: 72px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    #info .pwrap canvas {
      width: 72px;
      height: 72px;
      display: block;
      border-radius: 4px;
    }
    #info .ptext { flex: 1; }
    #info .cls { color: #d9c07a; font-size: 12px; }
    #info .trait { color: #e8a84d; font-size: 12px; font-weight: bold; }
    #info .title { color: #b8a06a; font-size: 12px; font-style: italic; }
    #info .sub, #info .terrain { color: #9aa3b5; font-size: 12px; }
    button {
      background: #2b5fd9;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #3a6ee8; }
    #help { font-size: 12px; color: #9aa3b5; margin-top: 8px; }
  </style>
</head>
<body>
  <h1 id="stage-name">조조전풍 SRPG</h1>
  <div id="wrap">
    <div id="banner"></div>
    <div id="menu"></div>
  </div>
  <div id="hud">
    <div id="info">유닛을 선택하세요</div>
    <button id="end-turn">턴 종료</button>
  </div>
  <div id="help">
    좌클릭: 선택 → 이동 → 행동 메뉴(공격/책략/아이템/대기) · 우클릭: 취소 ·
    파란 칸: 이동 범위 · 빨간 칸: 공격 · 보라 칸: 책략 · 초록 칸: 회복
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
